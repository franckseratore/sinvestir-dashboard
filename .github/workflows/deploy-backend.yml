name: Deploy Backend → Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  PROJECT_ID: sinvestir-dashboard-2026
  REGION: europe-west1
  SERVICE: sinvestir-dashboard-api
  REGISTRY: europe-west1-docker.pkg.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # requis pour Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build & push image
        working-directory: backend
        run: |
          docker build -t $REGISTRY/$PROJECT_ID/sinvestir/dashboard-api:$GITHUB_SHA .
          docker push $REGISTRY/$PROJECT_ID/sinvestir/dashboard-api:$GITHUB_SHA

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $REGISTRY/$PROJECT_ID/sinvestir/dashboard-api:$GITHUB_SHA \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "GSHEETS_STATS_ID=${{ secrets.GSHEETS_STATS_ID }},GSHEETS_ADS_ID=${{ secrets.GSHEETS_ADS_ID }},GSHEETS_CREDS_B64=${{ secrets.GSHEETS_CREDS_B64 }},SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }},NOTION_API_KEY=${{ secrets.NOTION_API_KEY }},NOTION_WEEKLY_DB_ID=${{ secrets.NOTION_WEEKLY_DB_ID }},AC_API_URL=${{ secrets.AC_API_URL }},AC_API_KEY=${{ secrets.AC_API_KEY }},ICLOSED_API_KEY=${{ secrets.ICLOSED_API_KEY }},COUT_AGENCE_MENSUEL=${{ secrets.COUT_AGENCE_MENSUEL }},DASHBOARD_URL=${{ secrets.DASHBOARD_URL }}" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --service-account ${{ secrets.WIF_SERVICE_ACCOUNT }} \
            --project $PROJECT_ID
